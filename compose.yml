services:
  nginx:
    image: nginx:1.31.6-alpine3.24-slim
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./php/src:/var/www/html:ro
    depends_on:
      - php
    networks:
      - portfolio_network

  php:
    build:
      context: ./php
    volumes:
      - ./php/src:/var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portfolio_network

  db:
    image: mariadb:13.0.2-ubi10
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=TCP" ]
      start_period: 10s
      start_interval: 1s
      interval: 30s
      timeout: 1s
      retries: 5
    networks:
      - portfolio_network

  phpmyadmin:
    image: phpmyadmin:5.2.3
    ports:
      - "8081:80"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - portfolio_network

volumes:
  db_data:

networks:
  portfolio_network:
    driver: bridge
